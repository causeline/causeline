# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "causeline"
version = "0.1.0a0"
description = "Causeline for Python: puts FastAPI requests and LangChain calls in the same trace as the React click and the Spring Boot request."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "BGSudharma" }]
keywords = ["fastapi", "langchain", "rag", "tracing", "traceparent", "debugging", "devtools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/causeline/causeline#readme"
Repository = "https://github.com/causeline/causeline"
Issues = "https://github.com/causeline/causeline/issues"

[project.optional-dependencies]
langchain = ["langchain-core>=1.0"]
test = ["pytest", "fastapi", "httpx", "uvicorn", "langchain-core>=1.0", "langchain-openai>=1.0", "numpy"]

[tool.hatch.build.targets.wheel]
packages = ["src/causeline"]

# The tests read the Java sources to catch drift, so they only run inside the repository.
[tool.hatch.build.targets.sdist]
exclude = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
